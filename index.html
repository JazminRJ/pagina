<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyectos De Animación</title>
    <style>

        html, body {
            height: 100%;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .cuadrado-rosado {
            position: fixed;
            top: 0;              /* pega arriba sin espacio */
            left: 70px;          /* justo después de la barra celeste */
            right: 0;
            width: auto;
            height: 100px;
            background-color: #f8c8d4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 0;    /* sin bordes redondeados si va pegada al borde */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 99;
            margin-bottom: 0;
        }

        .cuadrado-rosado h1 {
            font-size: clamp(1.2rem, 8vw, 2.5rem);
            font-weight: bold;
            color: black;
            margin: 0;
            padding: 15px;
            word-break: break-word;
            line-height: 1.3;
        }

        /* Barra celeste FIJA a la izquierda */
        .vertical {
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            height: 100vh;
            background-color: #87CEFA;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 0 6px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .vertical span {
            font-family: monospace;
            font-size: 1.6rem;
            font-weight: bold;
            line-height: 1.4;
            display: block;
            text-align: center;
        }

        /* Todo el contenido se desplaza a la derecha para no taparse con la barra */
        .main-content {
            margin-left: 90px;
            margin-top: 110px;   /* 100px barra + 10px espacio */
            display: flex;
            flex-direction: column;
            gap: 30px;
}

        /* Galería con imágenes pequeñas y link debajo */
        .img-ajedrez {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .galeria-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .galeria-item img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 3px solid black;
            border-radius: 4px;
        }
        .galeria-item a {
            font-family: Arial, sans-serif;
            font-size: 1rem;
            color: #0000EE;
            text-decoration: underline;
        }
        /* Sección de proyectos */
        .contenido {
            font-family: Arial, sans-serif;
        }
        ul {
            margin-top: 0;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
        body {
        background-image: url('img/Fondo\ .png');  /* ruta de tu foto */
        background-size: cover;        /* cubre toda la pantalla */
        background-position: center;   /* centra la imagen */
        background-repeat: no-repeat;  /* no repite */
        background-attachment: fixed;  /* el fondo no se mueve al hacer scroll */
}

    </style>
</head>
<body>
    <!-- Barra celeste fija -->
    <div class="vertical">
