<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos De Animación</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background-image: url(img/Fondo\ .png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* BARRA LATERAL */
        .vertical{
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            height: 100vh;
            background-color: #87CEFA;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .vertical span{
            font-size: 1.4rem;
            font-weight: bold;
            font-family: monospace;
            line-height: 1.3;
        }

        /* CUADRO ROSADO */
        .cuadrado-rosado{
            position: fixed;
            top: 0;
            left: 100px;
            right: 0;
            height: 100px;
            background-color: #f8c8d4;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 99;
        }

        .cuadrado-rosado h1{
            font-size: 2.3rem;
            color: black;
        }

        /* CONTENIDO */
        .main-content{
            margin-left: 120px;
            margin-top: 140px;
            padding: 20px;
        }

        .titulo{
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: black;
        }
        /* FILAS */
        .img-ajedrez{
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        /* TARJETAS */
        .galeria-item{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s;
        }
        .galeria-item:hover{
            transform: scale(1.05);
        }
        .galeria-item img{
            width: 260px;
            height: 220px;
            object-fit: cover;
            border: 5px solid black;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .galeria-item a{
            font-size: 1rem;
            font-weight: bold;
            color: #7b1fa2;
            text-decoration: none;
        }
        .galeria-item a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="vertical">
        <span>A</span>
        <span>N</span>
        <span>I</span>
        <span>M</span>
        <span>A</span>
        <span>C</span>
        <span>I</span>
        <span>Ó</span>
        <span>N</span>
        <br>
        <span>D</span>
        <span>E</span>
        <br>
        <span>G</span>
        <span>R</span>
        <span>Á</span>
        <span>F</span>
        <span>I</span>
        <span>C</span>
        <span>O</span>
        <span>S</span>

    </div>

    <!-- ENCABEZADO -->
    <div class="cuadrado-rosado">
        <h1>Bienvenidos a mi Página Web</h1>
    </div>
    <div class="main-content">
        <h2 class="titulo">Selecciona un Proyecto:</h2>
        <div class="img-ajedrez">

            <div class="galeria-item">
                <img src="img/ajedrez.png" alt="Ajedrez">
                <a href="tableroajedrez/index.html">
                    Tablero de Ajedrez-S01
                </a>
            </div>
            <div class="galeria-item">
                <img src="img/DRA.lisa.png" alt="Lisa Su">
                <a href="Biografia/index.html">
                    Biografía Dra. Lisa Su-S02
                </a>
            </div>
            <div class="galeria-item">
                <img src="img/img3.png" alt="Animación">
                <a href="Estiloanimacion/index.html">
                    Estilos de Animación-S3
                </a>
            </div
        </div>
        <div class="img-ajedrez">
            <div class="galeria-item">
                <img src="img/img4.png" alt="Animación por pasos">
                <a href="semana4/index.html">
                    Animación por Pasos-S4
                </a>
            </div>
            <div class="galeria-item">
                <img src="img/muñequito.png" alt="Proyecto 5">
                <a href="CLIPPATH/index.html">
                    Clippath-S05
                </a>
            </div>
            <div class="galeria-item">
                <img src="img/parallax.png" alt="Proyecto 6">
                <a href="efecto_parallax/index.html">
                    PARALLAX-S05
                </a>
            </div>
        </div>
    </div>
</body>
</html>
