<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyectos De Animación</title>
    <style>

        html, body {
            height: 100%;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .cuadrado-rosado {
            width: 100%;
            height: 100px;
            background-color: #f8c8d4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .cuadrado-rosado h1 {
            font-size: clamp(1.2rem, 8vw, 2.5rem);
            font-weight: bold;
            color: #5e2a3c;
            margin: 0;
            padding: 15px;
            word-break: break-word;
            line-height: 1.3;
        }

        .columnas {
            display: flex;
            gap: 40px;
            flex-grow: 1;  /* Toma toda la altura disponible después del cuadrado rosado */
            align-items: stretch; /* Para que los hijos se estiren verticalmente */
        }

        .vertical {
            width: 100px;
            height: 100%;
            background-color: #87CEFA;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .vertical span {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.3;
            display: block;
            text-align: center;
        }

        .vertical .bloque {
            margin: 2px 0;
        }

        .contenido {
            font-family: Arial, sans-serif;
            flex-grow: 1;
        }

        ul {
            margin-top: 0;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="cuadrado-rosado">
        <h1>Bienvenidos a mi Página Web</h1>
    </div>

    <div class="columnas">
        <div class="vertical">
            <span>A</span><span>N</span><span>I</span><span>M</span><span>A</span><span>C</span><span>I</span><span>O</span><span>N</span><br>
            <span>D</span><span>E</span><br>
            <span>G</span><span>R</span><span>A</span><span>F</span><span>I</span><span>C</span><span>O</span><span>S</span>
        </div>

        <div class="contenido">
            <h2>Selecciona un Proyecto:</h2>
            <ul>
                <li><a href="tableroajedrez/index.html">Tablero de Ajedrez</a></li>
                <li><a href="Biografia/index.html">Biografia Dra.Lisa Su</a></li>
                <li><a href="Estiloanimacion/index.html">Estilos de Animación</a></li>
                <li><a href="semana4/index.html">Animación por pasos</a></li>

            </ul>
        </div>
    </div>

</body>
</html>
