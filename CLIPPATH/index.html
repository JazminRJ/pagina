<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIPPATH SEMANA </title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        body{
            background-color: rgb(175, 139, 209);
        }
        .contenedor{
            width: 700px;
            height: 700px;
            top: 10;
            border: 1px solid black;
            position: relative;
            background-image: url(img/fondo.jpg);
            margin: 0 auto; 
            overflow: hidden;
        }
        .cabeza{
            width: 230px;
            height: 230px;
            top:145px;
            left: 265px;
            position:absolute;
            background-image:  url(img/cara.png)
            /* background-image: url(img/foca.jpg) */ ;/* figura con imagene*/
            background-size: cover;/* la imagen se cuadra bien */
            clip-path: circle(50% at 50% 50%);

        }
        .cuerpo{
            width: 200px;
            height: 320px;
            top:347px;
            left: 280px;
            position:absolute;
            background-image: url(img/jeans.jpg) ;
            background-size: cover;/* la imagen se cuadra bien */
            clip-path: polygon(35% 0, 61% 0, 87% 100%, 13% 100%);
        }
        .sonbrero
        {
            width: 210px;
            height: 210px;
            top:20px;
            left: 275px;
            position:absolute;
            background-image: url(img/sonbrero.jpg) ;/* figura con imagene
            background-size: cover;
            background-size: cover;/* la imagen se cuadra bien */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation: rebote 2s infinite;
        }
@keyframes rebote{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-50px);
    }
    100%{
        transform:translateY(0);
    }
}
        .brazos{
            width: 258px;
            height: 200px;
            top:330px;
            left: 260px;
            position:absolute;
            background-image: url(img/jeans.jpg) ;
            background-size: cover;
            clip-path: polygon(13% 36%, 91% 38%, 100% 50%, 91% 65%, 13% 64%, 0% 50%);

        }
        .pie1{
            width: 150px;
            height: 150px;
            top:580px;
            left: 250px;
            position:absolute;
            background-color: black;
            background-image: url(img/zapato.jpg) ;
            background-size: cover;/* la imagen se cuadra bien */
            clip-path: ellipse(44% 22% at 50% 50%);
            animation: pie 5s infinite;
            
        }
        @keyframes pie{
    0%{
        transform: translateX(0);
    }

    25%{
        transform: translateX(-5px);
    }

    50%{
        transform: translateX(5px);
    }

    75%{
        transform: translateX(-5px);
    }

    100%{
        transform: translateX(0);
    }
}
        .pie2{
            width: 150px;
            height: 150px;
            top:580px;
            left: 370px;
            position:absolute;
            background-image: url(img/zapato.jpg) ;
            background-size: cover;/* la imagen se cuadra bien */
            clip-path: ellipse(44% 22% at 50% 50%);
            animation: pie 5s infinite;
        }
        @keyframes pie{
    0%{
        transform: translateX(0);
    }

    25%{
        transform: translateX(-5px);
    }

    50%{
        transform: translateX(5px);
    }

    75%{
        transform: translateX(-5px);
    }

    100%{
        transform: translateX(0);
    }
}
        .bola1{
            width: 250px;
            height: 200px;
            top:285px;
            left: 385px;
            position:absolute;
            background-size: cover;
            background-image: url(img/bola1.png);
            clip-path: circle(7.6% at 50% 50%);
            animation: bola 5s infinite;
        }
        @keyframes bola{
    0%{
        transform: translateY(0px);
    }

    100%{
        transform: translateY(300px);
    }
}
        .bola2{
            width: 250px;
            height: 200px;
            top:285px;
            left: 405px;
            position:absolute;
            background-size: cover;
            background-image: url(img/bola2.png);
            clip-path: circle(7.6% at 50% 50%);
            animation: bol 5s infinite;

        }
        @keyframes bol{
    0%{
        transform: translateY(0px);
    }

    100%{
        transform: translateY(300px);
    }
}
        .cono{
            width: 250px;
            height: 200px;
            top:330px;
            left: 395px;
            position:absolute;
            background-size: cover;
            background-image: url(img/cono.jpg);
            clip-path: polygon(49% 64%, 40% 33%, 60% 33%);
        }
.arbusto{
    width:400px;
    height:400px;
    position:absolute;
    top:585px;
    left:-100px;
    background-image:url(img/arbusto.png);
    background-size:contain;
    background-repeat:no-repeat;
    z-index:5;
    animation: rebote 5s infinite;
}
@keyframes rebote{
    0%{
        transform:translateY(0);
    }
    50%{
        
        transform:translateY(-50px);
    }
    100%{
        transform:translateY(0);
    }
}
.arbusto2{
    width:400px;
    height:400px;
    position:absolute;
    top:585px;
    left:500px;
    background-image:url(img/arbusto.png);
    background-size:contain;
    background-repeat:no-repeat;
    z-index:5;
    animation: rebote 5s infinite;
}
@keyframes rebote{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-50px);
    }
    100%{
        transform:translateY(0);
    }
}
.sol{
    width:150px;
    height:150px;
    position:absolute;
    top:20px;
    left:490px;
    background-image:url(img/sol.png);
    background-size:contain;
    background-repeat:no-repeat;
    z-index:1;
    animation: sol 5s infinite;
}
@keyframes sol{

    0%{
        transform:translateX(-5px);
        opacity:0;
        filter: brightness(100%);
    }

    50%{
        transform:translateX(5px);
    }

    100%{
        transform:translateX(-5px);
        opacity:1;
        filter: brightness(100%);
    }

}
.volver{
        width: 40px;
        padding:20px;
        background-color: palevioletred;
        color:black;
        border:2px solid black;
        }
    </style>
</head>
<body>

</html>
