<html>
    <head>
        <title>VISITA PERÚ</title>
        <style>
            *{
                margin: 0px;
                padding:0px;
            }
            .contenedor{
                width: 1000px;
                height: 300px;
                position: relative;
                margin: 0 auto;
                border: 1px solid black;
                overflow: hidden;
            }
            .marco1{
                width:200px;
                height: 300px;
                background-color: red;
                position:absolute;
                top:0px;
                left: 0px;
                animation: marco1 2s  1 forwards;
                background-image: url(img/css.jpg);
                background-size: cover;

            }
            @keyframes marco1{
                0%{
                    top:-300px;
                    left:0px;
                    transform: scale(1.5);    /* agranda */ /* va agirar */
                }
                50%{
                    top: 300px;
                    left: 0px;
                }
                100%{
                    top:0px;
                    left: 0px;
                }
            }
            .marco2{
                width:200px;
                height: 300px;
                background-color: green;
                position:absolute;
                top:-300px;
                left: 200px;
                animation: marco2 2s 1 forwards 2s;
                background-image: url(img/php.jpg);
                background-size: cover;
            }
            @keyframes marco2{
                0%{
                    top:-300px;
                    left:200px;
                    transform: scale(0.5);    /* reduce */
                }
                50%{
                    top: 300px;
                    left: 200px;
                }
                100%{
                    top:0px;
                    left: 200px;
                }
            }
            .marco3{
                width:200px;
                height: 300px;
                background-color: yellow;
                position:absolute;
                top:-300px;
                left: 400px;
                animation: marco3 2s 1 forwards 4s;
                background-image: url(img/jv.jpg);
                background-size: cover;
            }
            @keyframes marco3{
                0%{
                    top:-300px;
                    left:400px;
                    transform: rotate(45deg) scale(1.2) translateX(50px);
                }
                50%{
                    top: 300px;
                    left: 400px;
                }
                100%{
                    top:0px;
                    left: 400px;
                }
            }
            .marco4{
                width:200px;
                height: 300px;
                background-color: blue;
                position:absolute;
                top:-300px;
                left: 600px;
                animation: marco4 2s 1 forwards 6s;
                background-image: url(img/html.jpg);
                background-size: cover;
            }
            @keyframes marco4{
                0%{
                    top:-300px;
                    left:600px;
                    transform:rotateY(180deg); /* va agirar */
                }
                50%{
                    top: 300px;
                    left: 600px;
                }
                100%{
                    top:0px;
                    left: 600px;
                }
            }
            .marco5{
                width:200px;
                height: 300px;
                background-color: blue;
                position:absolute;
                top:-300px;
                left: 800px;
                animation: marco5 2s 1 forwards 8s;
                background-image: url(img/sb.jpg);
                background-size: cover;
            }
            @keyframes marco5{
                0%{
                    top:-300px;
                    left:800px;
                    transform:rotatez(180deg); /* va agirar */
                }
                50%{
                    top: 300px;
                    left: 800px;
                }
                100%{
                    top:0px;
                    left: 800px;
                }
            }

        </style>
    </head>
    <body>
        <div class = "contenedor">
            <div class = "marco1"></div>
            <div class = "marco2"></div>
            <div class = "marco3"></div>
            <div class = "marco4"></div>
            <div class = "marco5"></div>

        </div>

    </body>
</html>
